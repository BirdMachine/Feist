name: Android debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package friendly APK name + checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Feist-BirdiePhotoMaid-v0.3-debug.apk
          cd dist
          sha256sum Feist-BirdiePhotoMaid-v0.3-debug.apk > Feist-BirdiePhotoMaid-v0.3-debug.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feist-debug-apk
          path: |
            dist/Feist-BirdiePhotoMaid-v0.3-debug.apk
            dist/Feist-BirdiePhotoMaid-v0.3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete feist-latest --yes --cleanup-tag || true
          gh release create feist-latest dist/Feist-BirdiePhotoMaid-v0.3-debug.apk dist/Feist-BirdiePhotoMaid-v0.3-debug.apk.sha256 \
            --target "$GITHUB_SHA" --title 'Feist v0.3 testing APK' --notes 'Review duplicates and screenshots, share selected images to a cloud app, then request Android-confirmed local deletion. Verify backups before deleting.' --prerelease --latest=false
