name: Android debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: feist-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FEIST_DEBUG_STORE_FILE: ${{ github.workspace }}/.github/feist-debug.keystore
      FEIST_DEBUG_STORE_PASSWORD: feist-debug
      FEIST_DEBUG_KEY_ALIAS: feist-debug
      FEIST_DEBUG_KEY_PASSWORD: feist-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore stable Feist debug/update signing key
        run: |
          base64 --decode .github/feist-debug.keystore.b64 > .github/feist-debug.keystore
          chmod 600 .github/feist-debug.keystore
          keytool -list -v \
            -keystore .github/feist-debug.keystore \
            -storepass feist-debug \
            -alias feist-debug | grep -F 'SHA256: 87:DE:17:92:D2:78:B5:A1:C5:15:79:F5:65:3F:79:58:B2:70:6D:03:8C:CE:72:C2:78:8F:F8:FC:8E:8F:29:DF'

      - name: Set monotonic Feist version code
        run: echo "FEIST_VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build stable-signed debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Package friendly APK name + checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Feist-latest.apk
          cd dist
          sha256sum Feist-latest.apk > Feist-latest.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feist-debug-apk
          path: |
            dist/Feist-latest.apk
            dist/Feist-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="feist-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Feist-latest.apk dist/Feist-latest.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Feist build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Feist debug build from main at ${GITHUB_SHA}. Signed with Feist's stable update key and a monotonic version code so compatible Feist debug builds can update in place."

      - name: Verify GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="feist-build-${GITHUB_RUN_NUMBER}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url >/tmp/feist-release.json
          test "$(jq -r '.tagName' /tmp/feist-release.json)" = "$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Feist-latest.apk'
          echo "Verified $TAG and Feist-latest.apk"
