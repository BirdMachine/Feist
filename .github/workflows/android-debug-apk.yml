name: Android debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Apply source compatibility fixes
        shell: bash
        run: |
          sed -i 's/button\.setTextAllCaps(false);/button.setAllCaps(false);/' \
            app/src/main/java/com/birdmachine/birdiephotomaid/MainActivity.java
          sed -i 's/setMinimumHeight(dp(260));/setMinimumHeight(Math.round(dp(260)));/' \
            app/src/main/java/com/birdmachine/birdiephotomaid/SafeZonePreview.java

      - name: Ensure official Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Persist source/tooling fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "CI: apply Android compile fixes"
            git push
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package friendly APK name + checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Feist-BirdiePhotoMaid-v0.2-debug.apk
          sha256sum dist/Feist-BirdiePhotoMaid-v0.2-debug.apk > dist/Feist-BirdiePhotoMaid-v0.2-debug.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feist-debug-apk
          path: |
            dist/Feist-BirdiePhotoMaid-v0.2-debug.apk
            dist/Feist-BirdiePhotoMaid-v0.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
